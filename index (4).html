<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Almirah: your digital wardrobe</title>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,500;1,500&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#1f1618;--wood:#2e2023;--brass:#c9a35b;--paper:#ece7e1;--ink:#1c1416;--mut:#a89a97}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--paper);font:15px/1.5 Figtree,system-ui,sans-serif}
h1,h2{font-family:'Bodoni Moda',Georgia,serif;font-weight:500;margin:0}
h1{font-size:clamp(36px,7vw,70px);font-style:italic;line-height:1}h2{font-size:26px;margin-bottom:10px}
header,section{padding:20px 5vw}header{display:flex;justify-content:space-between;align-items:end;flex-wrap:wrap;gap:12px}
button,select,input{font:inherit}
.btn{background:var(--brass);color:var(--ink);border:0;padding:9px 16px;border-radius:2px;cursor:pointer;font-weight:600}
.btn.o{background:none;color:var(--paper);border:1px solid var(--mut)}.btn:focus-visible,.hg:focus-visible{outline:2px solid var(--paper);outline-offset:2px}
input[type=text],input[type=password],select{background:var(--wood);color:var(--paper);border:1px solid #4a3a3d;padding:8px;border-radius:2px}
.rail{position:relative;padding-top:36px;overflow-x:auto;white-space:nowrap;min-height:340px;border-bottom:8px solid var(--wood)}
.rail:before{content:"";position:absolute;left:0;right:0;top:24px;height:5px;background:linear-gradient(var(--brass),#7a5f2e)}
.hg{display:inline-block;width:150px;margin-right:10px;vertical-align:top;cursor:pointer;transform-origin:50% 0;transition:transform .4s;background:none;border:0;color:inherit;padding:0}
.hg:hover{transform:rotate(-2deg)}.hg svg{display:block;margin:0 auto;width:64px}
.hg img{width:140px;height:200px;object-fit:contain;display:block;margin:-8px auto 0}
.hg small{display:block;text-align:center;color:var(--mut);white-space:normal}
.hg.out{animation:pull .9s ease forwards;position:relative;z-index:3}
@keyframes pull{30%{transform:translateY(-14px) rotate(6deg)}60%{transform:translateY(10px) scale(1.4) rotate(-4deg)}100%{transform:scale(1.3)}}
@media(prefers-reduced-motion:reduce){.hg.out{animation:none;transform:scale(1.3)}}
.empty{color:var(--mut);padding:60px 0;white-space:normal}
.detail{display:none;gap:14px;align-items:center;flex-wrap:wrap;padding:14px 0}.detail.on{display:flex}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0}
#outs{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;margin-top:14px}
.card{background:var(--wood);padding:14px;border-left:3px solid var(--brass)}
.card .ims{display:flex;gap:4px;background:var(--paper);padding:6px}.card .ims img{flex:1;min-width:0;height:110px;object-fit:contain}
.card h3{font:italic 500 21px 'Bodoni Moda',serif;margin:10px 0 0}.card p{margin:6px 0;color:#d8cfcb}.tag{color:var(--brass);font-weight:600}
.tr img{width:100%;margin-top:8px}#msg{min-height:22px;color:var(--brass)}details{color:var(--mut);margin:10px 0}
</style></head><body>
<header><h1>Almirah</h1><div class="row">
<label class="btn" tabindex="0">Add clothes<input id="up" type="file" accept="image/*" multiple hidden></label>
<label class="btn o" tabindex="0">My photo<input id="me" type="file" accept="image/*" hidden></label>
<label><input id="bg" type="checkbox" checked> Clean mockup</label></div></header>
<section><div id="msg" role="status"></div>
<details><summary>AI settings (free Gemini key)</summary><div class="row">
<input id="key" type="password" placeholder="Gemini API key from aistudio.google.com"><input id="model" type="text" value="gemini-2.5-flash" aria-label="Model">
<button class="btn o" id="sk">Save</button></div><small>Stored only in this browser. Without a key, tagging is manual and the stylist uses a basic fallback.</small></details></section>
<section><h2>Wardrobe</h2><div class="rail" id="rail"></div>
<div class="detail" id="detail"></div></section>
<section><h2>Style me</h2><div class="row"><input id="occ" type="text" size="34" placeholder="Today: lab day, presentation, hangout…"><button class="btn" id="go">Style me</button></div>
<div id="outs"></div></section>
<script>
const $=s=>document.querySelector(s),LIMIT=3;
const S=Object.assign({items:[],key:'',model:'gemini-2.5-flash',photo:'',tries:{}},JSON.parse(localStorage.getItem('wd')||'{}'));
const STYLES=['Old Money','Gen Z Streetwear','Smart Casual','Full Tuck-In Formal','Open Shirt Layered','Old School Retro','Quiet Luxury','Minimalist','Dark Academia','Y2K Casual'];
const CATS=['top','bottom','layer','shoes','accessory'];let outs=[];
const msg=t=>$('#msg').textContent=t,esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const save=()=>{try{localStorage.setItem('wd',JSON.stringify(S))}catch(e){msg('Storage full. Delete a few items.')}};
const byId=id=>S.items.find(x=>x.id==id);
async function shrink(b,max,type){const bm=await createImageBitmap(b),k=Math.min(1,max/Math.max(bm.width,bm.height)),c=document.createElement('canvas');c.width=bm.width*k;c.height=bm.height*k;c.getContext('2d').drawImage(bm,0,0,c.width,c.height);return c.toDataURL(type,.85)}
async function gem(parts){const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${S.model}:generateContent?key=${S.key}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts}],generationConfig:{responseMimeType:'application/json'}})});const j=await r.json();if(!r.ok)throw new Error(j.error?.message||r.status);return JSON.parse(j.candidates[0].content.parts[0].text)}
function rail(){const r=$('#rail');r.innerHTML=S.items.length?'':'<div class="empty">Your rail is empty. Add clothes to hang them here.</div>';
S.items.forEach(x=>{const b=document.createElement('button');b.className='hg';b.setAttribute('aria-label',x.name);
b.innerHTML=`<svg viewBox="0 0 64 40"><path d="M32 2a5 5 0 0 1 0 10v6L4 36h56L32 18" fill="none" stroke="#c9a35b" stroke-width="3"/></svg><img src="${x.img}" alt=""><small>${esc(x.name)}</small>`;
b.onclick=()=>{r.querySelectorAll('.out').forEach(e=>e.classList.remove('out'));void b.offsetWidth;b.classList.add('out');show(x)};r.append(b)})}
function show(x){const d=$('#detail');d.className='detail on';d.innerHTML=`<input type="text" id="dn" value="${esc(x.name)}"><select id="dc">${CATS.map(c=>`<option ${c==x.cat?'selected':''}>${c}</option>`).join('')}</select>
<span>${esc([x.color,x.fabric,x.fit,x.details].filter(Boolean).join(', '))} | worn ${x.worn}x</span><button class="btn" id="dw">Wore it</button><button class="btn o" id="dd">Delete</button>`;
$('#dn').onchange=e=>{x.name=e.target.value;save();rail()};$('#dc').onchange=e=>{x.cat=e.target.value;save()};
$('#dw').onclick=()=>{x.worn++;save();show(x)};$('#dd').onclick=()=>{S.items=S.items.filter(i=>i!=x);save();rail();d.className='detail'}}
$('#up').onchange=async e=>{for(const f of e.target.files){msg('Processing '+f.name+'…');let b=f;
try{if($('#bg').checked){const{removeBackground}=await import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/+esm');b=await removeBackground(f)}}catch(x){msg('Background removal failed here, kept the original photo.')}
const img=await shrink(b,480,'image/webp');let d={name:f.name.replace(/\.\w+$/,''),cat:'top'};
if(S.key)try{d=await gem([{inlineData:{mimeType:'image/webp',data:img.split(',')[1]}},{text:`Clothing item photo. Return JSON {"name":short name,"cat":one of ${CATS},"color":main colour,"fabric":guess,"fit":guess,"details":notable details}`}]);if(!CATS.includes(d.cat))d.cat='top'}catch(x){msg('AI tagging failed: '+x.message)}
S.items.push({id:Date.now()+Math.random(),img,worn:0,...d});save();rail()}msg('');e.target.value=''};
$('#me').onchange=async e=>{S.photo=await shrink(e.target.files[0],768,'image/jpeg');save();msg('Photo saved for try-on.')};
$('#sk').onclick=()=>{S.key=$('#key').value||S.key;S.model=$('#model').value;save();msg('Saved.')};
function fallback(){const p=c=>{const a=S.items.filter(x=>x.cat==c).sort((a,b)=>a.worn-b.worn+Math.random()-.5);return a[0]},o=[];
for(let i=0;i<4;i++){const ids=['top','bottom','layer','shoes'].map(p).filter(Boolean).map(x=>x.id);o.push({title:'Look '+(i+1),style:STYLES[i*2%STYLES.length],ids,why:'Basic fallback that picks your least-worn pieces. Add a Gemini key for real styling.',tip:''})}return o}
$('#go').onclick=async()=>{if(S.items.length<3)return msg('Add at least 3 items first.');msg('Styling…');
if(S.key)try{outs=await gem([{text:`You are a sharp personal fashion stylist for a university student. Build 6 distinct outfits using ONLY these wardrobe items. Known styles: ${STYLES.join(', ')}. You may name new styles when a look fits one better. Favour rarely worn items (worn count given). Use colour harmony, current trending palettes, texture and proportion, and keep each look wearable on campus. Mood or occasion: ${$('#occ').value||'regular university day'}. Items: ${JSON.stringify(S.items.map(({img,...r})=>r))}. Return a JSON array of {"title":string,"style":string,"ids":[item ids],"why":two sentences,"tip":one styling tip such as tuck, roll sleeves or layering}.`}])}catch(x){msg('Stylist error: '+x.message+'. Using fallback.');outs=fallback()}else outs=fallback();
msg('');const g=$('#outs');g.innerHTML='';outs.forEach((o,i)=>{const its=o.ids.map(byId).filter(Boolean),c=document.createElement('div');c.className='card';
c.innerHTML=`<div class="ims">${its.map(x=>`<img src="${x.img}" alt="${esc(x.name)}">`).join('')}</div><h3>${esc(o.title)}</h3><span class="tag">${esc(o.style)}</span><p>${esc(o.why)}</p><p><em>${esc(o.tip)}</em></p>
<div class="row"><button class="btn o w">Wear this</button><button class="btn t">Try on me</button></div><div class="tr"></div>`;
c.querySelector('.w').onclick=()=>{its.forEach(x=>x.worn++);save();msg('Logged. Wear counts updated.')};c.querySelector('.t').onclick=()=>tryon(its,c);g.append(c)})};
async function tryon(its,c){if(!S.photo)return msg('Add your photo first.');const day=new Date().toDateString();S.tries[day]=S.tries[day]||0;
if(S.tries[day]>=LIMIT)return msg('Daily try-on limit reached ('+LIMIT+'). Free GPUs are limited.');const g=its.find(x=>x.cat=='top')||its.find(x=>x.cat=='layer');if(!g)return msg('This look has no top to try on.');
msg('Trying on. This can take 1 to 2 minutes…');try{const{Client}=await import('https://cdn.jsdelivr.net/npm/@gradio/client@1.15.1/+esm'),blob=u=>fetch(u).then(r=>r.blob()),cl=await Client.connect('yisol/IDM-VTON');
const r=await cl.predict('/tryon',[{background:await blob(S.photo),layers:[],composite:null},await blob(g.img),g.name,true,false,30,42]);
c.querySelector('.tr').innerHTML=`<img src="${r.data[0].url}" alt="Outfit tried on you">`;S.tries[day]++;save();msg('Done.')}catch(x){msg('Try-on failed: '+(x.message||'Space busy')+'. Try again later.')}}
$('#key').value=S.key;$('#model').value=S.model;rail();
</script></body></html>
