<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Almari: your digital wardrobe</title>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,500;1,500&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#1f1618;--wood:#2e2023;--brass:#c9a35b;--paper:#ece7e1;--ink:#1c1416;--mut:#a89a97}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--paper);font:15px/1.5 Figtree,system-ui,sans-serif}
h1,h2{font-family:'Bodoni Moda',Georgia,serif;font-weight:500;margin:0}
h1{font-size:clamp(36px,7vw,70px);font-style:italic;line-height:1}h2{font-size:26px;margin-bottom:10px}
header,section{padding:20px 5vw}header{display:flex;justify-content:space-between;align-items:end;flex-wrap:wrap;gap:12px}
button,select,input{font:inherit}
.btn{background:var(--brass);color:var(--ink);border:0;padding:9px 16px;border-radius:2px;cursor:pointer;font-weight:600}
.btn.o{background:none;color:var(--paper);border:1px solid var(--mut)}.btn:focus-visible,.hg:focus-visible{outline:2px solid var(--paper);outline-offset:2px}
input[type=text],input[type=password],select{background:var(--wood);color:var(--paper);border:1px solid #4a3a3d;padding:8px;border-radius:2px}
.rail{position:relative;padding-top:36px;overflow-x:auto;white-space:nowrap;min-height:340px;border-bottom:8px solid var(--wood)}
.rail:before{content:"";position:absolute;left:0;right:0;top:24px;height:5px;background:linear-gradient(var(--brass),#7a5f2e)}
.hg{display:inline-block;width:150px;margin-right:10px;vertical-align:top;cursor:pointer;transform-origin:50% 0;transition:transform .4s;background:none;border:0;color:inherit;padding:0}
.hg:hover{transform:rotate(-2deg)}.hg svg{display:block;margin:0 auto;width:64px}
.hg img{width:140px;height:200px;object-fit:contain;display:block;margin:-8px auto 0;filter:drop-shadow(0 16px 10px rgba(0,0,0,.6));transition:transform .15s}
.hg small{display:block;text-align:center;color:var(--mut);white-space:normal}
.hg.out{animation:pull .9s ease forwards;position:relative;z-index:3}
@keyframes pull{30%{transform:translateY(-14px) rotate(6deg)}60%{transform:translateY(10px) scale(1.4) rotate(-4deg)}100%{transform:scale(1.3)}}
@media(prefers-reduced-motion:reduce){.hg.out{animation:none;transform:scale(1.3)}}
.empty{color:var(--mut);padding:60px 0;white-space:normal}
.detail{display:none;gap:14px;align-items:center;flex-wrap:wrap;padding:14px 0}.detail.on{display:flex}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0}
#outs{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;margin-top:14px}
.card{background:var(--wood);padding:14px;border-left:3px solid var(--brass)}
.card .ims{display:flex;gap:4px;background:var(--paper);padding:6px}.card .ims img{flex:1;min-width:0;height:110px;object-fit:contain}
.card h3{font:italic 500 21px 'Bodoni Moda',serif;margin:10px 0 0}.card p{margin:6px 0;color:#d8cfcb}.tag{color:var(--brass);font-weight:600}
.tr img{width:100%;margin-top:8px}#msg{position:fixed;left:0;right:0;bottom:0;z-index:9;background:#000d;padding:10px 5vw;color:var(--brass)}#msg:empty{display:none}details{color:var(--mut);margin:10px 0}
</style></head><body>
<header><h1>Almari</h1><div class="row">
<label class="btn" tabindex="0">Add clothes<input id="up" type="file" accept="image/*" multiple hidden></label>
<label class="btn o" tabindex="0">My photo<input id="me" type="file" accept="image/*" hidden></label>
<label><input id="bg" type="checkbox" checked> Clean mockup</label></div></header>
<section><div id="msg" role="status"></div>
<details><summary>AI settings (free Gemini key)</summary><div class="row">
<input id="key" type="password" placeholder="Gemini API key from aistudio.google.com"><input id="model" type="text" value="gemini-3.5-flash" aria-label="Model">
<input id="hf" type="password" placeholder="Hugging Face token (optional, more try-on quota)"><button class="btn o" id="sk">Save</button></div><small>Stored only in this browser. Without a key, tagging is manual and the stylist uses a basic fallback.</small></details></section>
<section><h2>Wardrobe</h2><div class="rail" id="rail"></div>
<div class="detail" id="detail"></div></section>
<section><h2>Style me</h2><div class="row"><input id="occ" type="text" size="34" placeholder="Today: lab day, presentation, hangout…"><button class="btn" id="go">Style me</button></div>
<div id="outs"></div></section>
<script>
const $=s=>document.querySelector(s),LIMIT=3;
const S=Object.assign({items:[],key:'',model:'gemini-3.5-flash',photo:'',tries:{}},JSON.parse(localStorage.getItem('wd')||'{}'));
const STYLES=['Old Money','Gen Z Streetwear','Smart Casual','Full Tuck-In Formal','Open Shirt Layered','Old School Retro','Quiet Luxury','Minimalist','Dark Academia','Y2K Casual'];
const CATS=['top','bottom','layer','shoes','accessory'];let outs=[];
const msg=t=>$('#msg').textContent=t,esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const save=()=>{try{localStorage.setItem('wd',JSON.stringify(S))}catch(e){msg('Storage full. Delete a few items.')}};
const byId=id=>S.items.find(x=>x.id==id);
async function shrink(b,max,type){const bm=await createImageBitmap(b),k=Math.min(1,max/Math.max(bm.width,bm.height)),c=document.createElement('canvas');c.width=bm.width*k;c.height=bm.height*k;c.getContext('2d').drawImage(bm,0,0,c.width,c.height);return c.toDataURL(type,.85)}
async function gem(parts){const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${S.model}:generateContent?key=${S.key}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts}],generationConfig:{responseMimeType:'application/json'}})});const j=await r.json();if(!r.ok)throw new Error(j.error?.message||r.status);return JSON.parse(j.candidates[0].content.parts[0].text)}
function rail(){const r=$('#rail');r.innerHTML=S.items.length?'':'<div class="empty">Your rail is empty. Add clothes to hang them here.</div>';
S.items.forEach(x=>{const b=document.createElement('button');b.className='hg';b.setAttribute('aria-label',x.name);
b.innerHTML=`<svg viewBox="0 0 64 40"><path d="M32 2a5 5 0 0 1 0 10v6L4 36h56L32 18" fill="none" stroke="#c9a35b" stroke-width="3"/></svg><img src="${x.img}" alt=""><small>${esc(x.name)}</small>`;
b.onmousemove=ev=>{const q=b.getBoundingClientRect();b.querySelector('img').style.transform=`perspective(500px) rotateY(${((ev.clientX-q.left)/q.width-.5)*45}deg)`};b.onmouseleave=()=>b.querySelector('img').style.transform='';b.onclick=()=>{r.querySelectorAll('.out').forEach(e=>e.classList.remove('out'));void b.offsetWidth;b.classList.add('out');show(x)};r.append(b)})}
function show(x){const d=$('#detail');d.className='detail on';d.innerHTML=`<input type="text" id="dn" value="${esc(x.name)}"><select id="dc">${CATS.map(c=>`<option ${c==x.cat?'selected':''}>${c}</option>`).join('')}</select>
<span>${esc([x.color,x.fabric,x.fit,x.details].filter(Boolean).join(', '))} | worn ${x.worn}x</span><button class="btn" id="dw">Wore it</button><button class="btn o" id="dd">Delete</button>`;
$('#dn').onchange=e=>{x.name=e.target.value;save();rail()};$('#dc').onchange=e=>{x.cat=e.target.value;save()};
$('#dw').onclick=()=>{x.worn++;save();show(x)};$('#dd').onclick=()=>{S.items=S.items.filter(i=>i!=x);save();rail();d.className='detail'}}
let SEG;
async function extract(f){const src=await shrink(f,768,'image/png');SEG=SEG||await(await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.2/+esm')).pipeline('image-segmentation','Xenova/segformer_b2_clothes');
const G={'Upper-clothes':'top','Dress':'top','Skirt':'bottom','Pants':'bottom'};let best;
for(const r of await SEG(src)){if(!G[r.label])continue;let n=0;for(const v of r.mask.data)if(v>127)n++;if(!best||n>best.n)best={r,n}}
if(!best||best.n<800)throw Error('no garment found');
const bm=await createImageBitmap(await(await fetch(src)).blob()),W=bm.width,H=bm.height,c=document.createElement('canvas'),m=document.createElement('canvas'),mk=best.r.mask;c.width=W;c.height=H;const x=c.getContext('2d');x.drawImage(bm,0,0);
m.width=mk.width;m.height=mk.height;const mc=m.getContext('2d'),id=mc.createImageData(m.width,m.height);for(let i=0;i<mk.data.length;i++)id.data[i*4+3]=mk.data[i]>127?255:0;mc.putImageData(id,0,0);
x.globalCompositeOperation='destination-in';x.drawImage(m,0,0,W,H);
const a=x.getImageData(0,0,W,H).data;let x0=W,y0=H,x1=0,y1=0;for(let i=3,p=0;i<a.length;i+=4,p++)if(a[i]>0){const px=p%W,py=p/W|0;if(px<x0)x0=px;if(px>x1)x1=px;if(py<y0)y0=py;if(py>y1)y1=py}
const o=document.createElement('canvas');o.width=x1-x0+1;o.height=y1-y0+1;const ox=o.getContext('2d');ox.drawImage(c,-x0,-y0);
ox.globalCompositeOperation='source-atop';const g=ox.createLinearGradient(0,0,o.width,o.height);g.addColorStop(0,'rgba(255,255,255,.22)');g.addColorStop(.5,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(0,0,0,.35)');ox.fillStyle=g;ox.fillRect(0,0,o.width,o.height);
return{img:o.toDataURL('image/webp',.85),cat:G[best.r.label]}}
$('#up').onchange=async e=>{let bad=0;for(const f of e.target.files){msg('Extracting the garment from '+f.name+' (first run downloads a model, be patient)…');let img,cat='top';
try{if($('#bg').checked){const r=await extract(f);img=r.img;cat=r.cat}else img=await shrink(f,480,'image/webp')}catch(x){bad=1;msg('Extraction failed ('+x.message+'), kept the original photo.');img=await shrink(f,480,'image/webp')}
let d={name:f.name.replace(/\.\w+$/,''),cat};
if(S.key)try{const t=await gem([{inlineData:{mimeType:'image/webp',data:img.split(',')[1]}},{text:`Photo of one clothing item. If it is not clothing return {"clothing":false}. Otherwise return JSON {"clothing":true,"name":short product-style name,"cat":one of ${CATS},"color":main colour,"fabric":guess,"fit":guess,"details":notable details}`}]);if(t.clothing===false){bad=1;msg('Skipped '+f.name+': no clothing found.');continue}d={...d,...t};delete d.clothing;if(!CATS.includes(d.cat))d.cat=cat}catch(x){bad=1;msg('AI tagging failed: '+x.message)}
S.items.push({id:Date.now(),img,worn:0,...d});save();rail()}if(!bad)msg('');e.target.value=''};
$('#me').onchange=async e=>{S.photo=await shrink(e.target.files[0],768,'image/jpeg');save();msg('Photo saved for try-on.')};
$('#sk').onclick=()=>{S.key=$('#key').value||S.key;S.hf=$('#hf').value||S.hf;S.model=$('#model').value;save();msg('Saved.')};
function fallback(){const p=c=>{const a=S.items.filter(x=>x.cat==c).sort((a,b)=>a.worn-b.worn+Math.random()-.5);return a[0]},o=[];
for(let i=0;i<4;i++){const ids=['top','bottom','layer','shoes'].map(p).filter(Boolean).map(x=>x.id);o.push({title:'Look '+(i+1),style:STYLES[i*2%STYLES.length],ids,why:'Basic fallback that picks your least-worn pieces. Add a Gemini key for real styling.',tip:''})}return o}
function render(){const g=$('#outs');g.innerHTML='';outs.forEach(o=>{const its=o.ids.map(byId).filter(Boolean),c=document.createElement('div');c.className='card';
c.innerHTML=`<div class="ims">${its.map(x=>`<img src="${x.img}" alt="${esc(x.name)}">`).join('')}</div><h3>${esc(o.title)}</h3><span class="tag">${esc(o.style)}</span><p>${esc(o.why)}</p><p><em>${esc(o.tip)}</em></p>
<div class="row"><button class="btn o w">Wear this</button><button class="btn t">Try on me</button><button class="btn o gm">Try in Gemini</button></div><div class="tr"></div>`;
c.querySelector('.w').onclick=()=>{its.forEach(x=>x.worn++);save();msg('Logged. Wear counts updated.')};c.querySelector('.t').onclick=()=>tryon(its,c);c.querySelector('.gm').onclick=()=>viaGemini(its);g.append(c)})}
$('#go').onclick=async()=>{if(S.items.length<3)return msg('Add at least 3 items first.');msg('Your stylist is thinking…');
try{if(!S.key)throw Error('no Gemini key saved in AI settings');
const o=await gem([{text:`You are an elite personal stylist with Gen Z taste and old-school tailoring knowledge, dressing a university student. Wardrobe JSON (n is the item number): ${JSON.stringify(S.items.map(({img,id,...r},n)=>({n,...r})))}. Create 6 outfits using ONLY these item numbers. Rules: every outfit needs a top and a bottom (or one piece); add layer, shoes or accessory only if they exist and truly improve it; use each item in at most 2 outfits; favour low worn counts; give each outfit a specific style identity chosen from ${STYLES.join(', ')} or invent a sharper one (Tennis Club, Soft Grunge, Coquette Menswear…); reason about colour harmony, current trending palettes, contrast, texture, silhouette and proportion (wide leg with a fitted top, one statement piece only); if the wardrobe cannot make a good look in a style, skip that style instead of forcing it. Mood or occasion: ${$('#occ').value||'normal university day'}. Return a JSON array of {"title":evocative name,"style":string,"ids":[item numbers],"why":two sentences on the colour and silhouette logic,"tip":exactly how to wear it: tuck, sleeves, buttons, shoes}.`}]);
outs=(Array.isArray(o)?o:o.outfits||[]).map(z=>({...z,ids:(z.ids||[]).map(n=>S.items[n]?.id).filter(Boolean)})).filter(z=>z.ids.length>1);
if(!outs.length)throw Error('stylist returned no usable outfits');msg('')}catch(x){msg('Stylist problem: '+x.message+'. Showing the basic fallback instead.');outs=fallback()}
render()};
async function tryon(its,c){if(!S.photo)return msg('Add your photo first.');const day=new Date().toDateString();S.tries[day]=S.tries[day]||0;
if(S.tries[day]>=LIMIT)return msg('Daily try-on limit reached ('+LIMIT+').');const g=its.find(x=>x.cat=='top')||its.find(x=>x.cat=='layer');if(!g)return msg('This look has no top to try on.');
msg('Trying on. This can take 1 to 2 minutes…');try{const{Client}=await import('https://cdn.jsdelivr.net/npm/@gradio/client@1.15.1/+esm'),blob=u=>fetch(u).then(r=>r.blob()),cl=await Client.connect('yisol/IDM-VTON',S.hf?{hf_token:S.hf}:{});
const r=await cl.predict('/tryon',[{background:await blob(S.photo),layers:[],composite:null},await blob(g.img),g.name,true,false,30,42]);
c.querySelector('.tr').innerHTML=`<img src="${r.data[0].url}" alt="Outfit tried on you">`;S.tries[day]++;save();msg('Done.')}catch(x){msg('Try-on failed: '+(x.message||JSON.stringify(x))+'. The free GPU may be busy or out of quota; add a free Hugging Face token in settings, or use Try in Gemini.')}}
async function viaGemini(its){const W=400,c=document.createElement('canvas');c.width=W*its.length;c.height=520;const x=c.getContext('2d');x.fillStyle='#ece7e1';x.fillRect(0,0,c.width,520);
for(const[i,it]of its.entries()){const im=await createImageBitmap(await(await fetch(it.img)).blob()),k=Math.min(380/im.width,500/im.height);x.drawImage(im,i*W+(W-im.width*k)/2,(520-im.height*k)/2,im.width*k,im.height*k)}
const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='outfit.png';a.click();
await navigator.clipboard.writeText('Image 1 is my photo and image 2 shows an outfit made of separate pieces. Dress me in exactly these clothes. Keep my face, body, pose and background unchanged, with a realistic fit and fabric drape, full-body photo.').catch(()=>{});
window.open('https://gemini.google.com/app','_blank');msg('outfit.png downloaded and the prompt is copied. In Gemini, attach your own photo and outfit.png, then paste the prompt.')}
$('#key').value=S.key;$('#hf').value=S.hf||'';$('#model').value=S.model;rail();
</script></body></html>
